<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бар Recept — Меню</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #e5a93b;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 30px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      padding: 12px 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--accent);
    }

    .lang-switcher select {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--accent);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border-color: var(--accent);
    }

    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 18px;
      color: var(--accent);
      margin: 20px 0 12px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-left: 3px solid var(--accent);
      padding-left: 8px;
    }

    .menu-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .dish-info {
      flex: 1;
    }

    .dish-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .dish-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    .dish-price {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="brand">BAR RECEPT</div>
      <div class="lang-switcher">
        <select id="langSelect" onchange="changeLang(this.value)">
          <option value="ru">🇷🇺 RU</option>
          <option value="en">🇬🇧 EN</option>
          <option value="th">🇹🇭 TH</option>
        </select>
      </div>
    </div>
    <div class="categories" id="catNav"></div>
  </header>

  <div class="container" id="menuContainer"></div>

  <script>
    const menuData = [
      {
        catId: "cold",
        catName: { ru: "Холодные закуски и салаты", en: "Cold Appetizers & Salads", th: "อาหารว่างเย็นและสลัด" },
        items: [
          { title: { ru: "Тар-тар из семги", en: "Salmon Tartare", th: "แซลมอนทาร์ทาร์" }, desc: "250гр", price: "2 400 тг" },
          { title: { ru: "Филе скумбрии с горячим картофелем", en: "Mackerel Fillet with Hot Potatoes", th: "ฟิลเลต์ปลาแมคเคอเรลกับมันฝรั่งร้อน" }, desc: "250гр", price: "1 700 тг" },
          { title: { ru: "Сырная тарелка", en: "Cheese Platter", th: "ชีสเพลตเตอร์" }, desc: "180гр", price: "1 900 тг" },
          { title: { ru: "Рыбная нарезка", en: "Fish Platter", th: "ปลาดิบรวม" }, desc: "200гр", price: "2 700 тг" },
          { title: { ru: "Нарезка по-казахски", en: "Kazakh Style Meat Platter", th: "จานเนื้อสไตล์คาซัค" }, desc: "200гр", price: "3 900 тг" },
          { title: { ru: "Паштет из говяжей печени", en: "Beef Liver Pate", th: "ปาเตตับวัว" }, desc: "150гр", price: "900 тг" },
          { title: { ru: "Цезарь с курицей", en: "Chicken Caesar Salad", th: "ซีซาร์สลัดไก่" }, desc: "300гр", price: "1 800 тг" },
          { title: { ru: "Оливки, маслины", en: "Olives", th: "มะกอก" }, desc: "150гр", price: "900 тг" },
          { title: { ru: "Фруктовая нарезка", en: "Fruit Platter", th: "ผลไม้รวม" }, desc: "400гр", price: "5 500 тг" }
        ]
      },
      {
        catId: "hot_snack",
        catName: { ru: "Горячие закуски", en: "Hot Appetizers", th: "อาหารว่างร้อน" },
        items: [
          { title: { ru: "Брускетта с говядиной и корнишонами", en: "Bruschetta with Beef & Gherkins", th: "บรูสเก็ตต้าเนื้อวัวและเเตงกวาดอง" }, desc: "180гр", price: "1 300 тг" },
          { title: { ru: "Брускетта с риккотой и вялеными помидорами", en: "Bruschetta with Ricotta & Sun-dried Tomatoes", th: "บรูสเก็ตต้ารีกอตต้าและมะเขือเทศตากแห้ง" }, desc: "150гр", price: "1 100 тг" },
          { title: { ru: "Тарелка пивных креветок", en: "Beer Shrimps Platter", th: "กุ้งทานกับเบียร์" }, desc: "180гр", price: "4 300 тг" },
          { title: { ru: "Хвосты королевских креветок", en: "King Prawn Tails", th: "หางกุ้งคิงพราวน์" }, desc: "180гр", price: "5 200 тг" },
          { title: { ru: "Стейк-салат с говядиной", en: "Beef Steak Salad", th: "สเต็กสลัดเนื้อ" }, desc: "300гр", price: "2 200 тг" },
          { title: { ru: "Сет из колбасок", en: "Sausage Set", th: "ไส้กรอกรวม" }, desc: "400гр", price: "4 900 тг" },
          { title: { ru: "Бургер с говядиной", en: "Beef Burger", th: "เบอร์เกอร์เนื้อ" }, desc: "400гр", price: "1 700 тг" }
        ]
      },
      {
        catId: "soups",
        catName: { ru: "Супы и выпечка", en: "Soups & Bakery", th: "ซุปและเบเกอรี่" },
        items: [
          { title: { ru: "Мексиканский суп с фасолью и говядиной", en: "Mexican Beef & Bean Soup", th: "ซุปเม็กซิกันถั่วและเนื้อวัว" }, desc: "400гр", price: "1 900 тг" },
          { title: { ru: "Хлебная корзина", en: "Bread Basket", th: "ตะกร้าขนมปัง" }, desc: "200гр", price: "2 200 тг" }
        ]
      },
      {
        catId: "mains",
        catName: { ru: "Горячие блюда", en: "Main Courses", th: "อาหารจานหลัก" },
        items: [
          { title: { ru: "Стейк New York", en: "New York Steak", th: "นิวยอร์กสเต็ก" }, desc: "200гр", price: "4 300 тг" },
          { title: { ru: "Пепер-стейк", en: "Pepper Steak", th: "พริกไทยสเต็ก" }, desc: "200гр", price: "4 200 тг" },
          { title: { ru: "Рулет из куриной грудки с моцареллой и шпинатом", en: "Chicken Breast Roll with Mozzarella & Spinach", th: "ไก่ม้วนยัดไส้ชีสมอสซาเรลล่าและปวยเล้ง" }, desc: "250гр", price: "2 400 тг" },
          { title: { ru: "Бефстроганов с грибами", en: "Beef Stroganoff with Mushrooms", th: "สโตรกานอฟเนื้อใส่เห็ด" }, desc: "250гр", price: "2 200 тг" },
          { title: { ru: "Говяжьи ребра «Терияки»", en: "Teriyaki Beef Ribs", th: "ซี่โครงเนื้อเทริยากิ" }, desc: "400гр", price: "4 900 тг" }
        ]
      },
      {
        catId: "sides",
        catName: { ru: "Гарниры", en: "Side Dishes", th: "เครื่องเคียง" },
        items: [
          { title: { ru: "Овощи-гриль с сыром рикотта", en: "Grilled Vegetables with Ricotta", th: "ผักย่างย่างกับชีสรีกอตต้า" }, desc: "250гр", price: "1 300 тг" },
          { title: { ru: "Картофель фри", en: "French Fries", th: "เฟรนช์ฟรายส์" }, desc: "150гр", price: "500 тг" }
        ]
      }
    ];

    let currentLang = 'ru';

    function renderNav() {
      const nav = document.getElementById('catNav');
      nav.innerHTML = menuData.map((cat, idx) => `
        <button class="cat-btn ${idx === 0 ? 'active' : ''}" onclick="scrollToCat('${cat.catId}', this)">
          ${cat.catName[currentLang]}
        </button>
      `).join('');
    }

    function renderMenu() {
      const container = document.getElementById('menuContainer');
      container.innerHTML = menuData.map(cat => `
        <div id="${cat.catId}">
          <h2 class="section-title">${cat.catName[currentLang]}</h2>
          ${cat.items.map(item => `
            <div class="menu-card">
              <div class="dish-info">
                <div class="dish-title">${item.title[currentLang]}</div>
                <div class="dish-desc">${item.desc}</div>
              </div>
              <div class="dish-price">${item.price}</div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    function changeLang(lang) {
      currentLang = lang;
      renderNav();
      renderMenu();
    }

    function scrollToCat(id, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const el = document.getElementById(id);
      if (el) {
        const offset = 120;
        const bodyRect = document.body.getBoundingClientRect().top;
        const elementRect = el.getBoundingClientRect().top;
        const elementPosition = elementRect - bodyRect;
        const offsetPosition = elementPosition - offset;
        window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
      }
    }

    renderNav();
    renderMenu();
  </script>
</body>
</html>
